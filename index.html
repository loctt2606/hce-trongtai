<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Tính Điểm Thi Đấu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>⚽ Bảng Tính Điểm Thi Đấu</h1>
  </header>

  <!-- BẢNG TỶ SỐ LỚN -->
  <section class="scoreboard">
    <div class="team-score left-side">
      <div class="team-name" id="nameA">Đội A</div>
      <div class="score-display" id="scoreA">0</div>
    </div>

    <div class="scoreboard-center">
      <div class="separator">:</div>
      <div class="match-info">
        <div class="timer" id="timerDisplay">00:00</div>
        <div class="match-status" id="matchStatus">Chưa bắt đầu</div>
      </div>
    </div>

    <div class="team-score right-side">
      <div class="team-name" id="nameB">Đội B</div>
      <div class="score-display" id="scoreB">0</div>
    </div>
  </section>

  <!-- THIẾT LẬP -->
  <section class="setup-section">
    <div class="setup-card">
      <h2>⚙️ Thiết lập trận đấu</h2>
      <div class="setup-row">
        <div class="setup-field">
          <label for="inputNameA">Tên Bên A</label>
          <input type="text" id="inputNameA" placeholder="" maxlength="30" />
        </div>

        <div class="setup-field">
          <label for="inputNameB">Tên Bên B</label>
          <input type="text" id="inputNameB" placeholder="" maxlength="30" />
        </div>

        <div class="setup-field">
          <label for="pointStep">Bước điểm (+/-)</label>
          <input type="number" id="pointStep" value="1" min="1" max="9999" placeholder="1" />
        </div>
      </div>

      <div class="setup-buttons">
        <button class="btn btn-start" id="btnStart" onclick="startMatch()">▶ Bắt đầu</button>
        <button class="btn btn-pause" id="btnPause" onclick="pauseMatch()" disabled>⏸ Tạm dừng</button>
        <button class="btn btn-reset" onclick="resetMatch()">🔄 Đặt lại</button>
      </div>
    </div>
  </section>

  <!-- ĐIỀU KHIỂN ĐIỂM -->
  <section class="controls-section">
    <!-- Bên A -->
    <div class="player-card card-a">
      <div class="player-label" id="labelA">Đội A</div>
      <div class="score-badge" id="badgeA">0</div>
      <div class="btn-group">
        <button class="score-btn btn-plus" onclick="changeScore('A', +1)" aria-label="Tăng điểm A">＋</button>
        <button class="score-btn btn-minus" onclick="changeScore('A', -1)" aria-label="Giảm điểm A">－</button>
      </div>
      <div class="score-history" id="historyA"></div>
    </div>

    <div class="vs-divider">VS</div>

    <!-- Bên B -->
    <div class="player-card card-b">
      <div class="player-label" id="labelB">Đội B</div>
      <div class="score-badge" id="badgeB">0</div>
      <div class="btn-group">
        <button class="score-btn btn-plus" onclick="changeScore('B', +1)" aria-label="Tăng điểm B">＋</button>
        <button class="score-btn btn-minus" onclick="changeScore('B', -1)" aria-label="Giảm điểm B">－</button>
      </div>
      <div class="score-history" id="historyB"></div>
    </div>
  </section>

  <!-- LOG SỰ KIỆN -->
  <section class="log-section">
    <div class="log-card">
      <div class="log-header">
        <h3>📋 Lịch sử điểm</h3>
        <button class="btn-clear-log" onclick="clearLog()">Xóa</button>
      </div>
      <ul class="event-log" id="eventLog">
        <li class="log-empty">Chưa có sự kiện nào.</li>
      </ul>
    </div>
  </section>

  <!-- MODAL KẾT QUẢ -->
  <div class="modal-overlay" id="resultModal" hidden>
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">🏆</div>
      <h2 class="modal-title" id="modalTitle">Kết thúc trận đấu!</h2>
      <p class="modal-result" id="modalResult"></p>
      <div class="modal-scores">
        <span id="modalNameA"></span>
        <span class="modal-score-sep">:</span>
        <span id="modalNameB"></span>
      </div>
      <div class="modal-score-nums">
        <span id="modalScoreA"></span>
        <span>—</span>
        <span id="modalScoreB"></span>
      </div>
      <button class="btn btn-reset modal-btn" onclick="resetMatch()">🔄 Trận mới</button>
      <button class="btn btn-close-modal" onclick="closeModal()">✕ Đóng</button>
    </div>
  </div>

  <!-- NÚT KẾT THÚC -->
  <section class="end-section">
    <button class="btn btn-end" onclick="endMatch()">🏁 Kết thúc trận đấu</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
